name: CI ServiStack

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servistack-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servistack-backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Analisis estatico con ESLint
        run: npm run lint

      - name: Pruebas y cobertura
        run: |
          mkdir -p coverage
          npm run test:cobertura

      - name: Subir cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: servistack-backend/coverage/lcov.info

      - name: Auditoria de dependencias
        run: npm audit --omit=dev --audit-level=high

      - name: Construir imagen Docker
        run: docker build -t servistack-backend:${{ github.sha }} .

      - name: Escaneo de la imagen con Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: servistack-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servistack-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servistack-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npx ng test --watch=false --browsers=ChromeHeadlessSinSandbox

      - name: Construir la aplicacion
        run: npm run build

  analisis-sonarcloud:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: servistack-backend/coverage

      - uses: SonarSource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: servistack-backend
          args: -Dsonar.organization=${{ vars.SONAR_ORGANIZACION }}
