services:
  web:
    build: ./servistack-frontend
    environment:
      API_URL: ${API_URL:-http://localhost:8000/api}
      LOCALE_FECHAS: ${LOCALE_FECHAS:-es-CO}
      AUTH0_DOMINIO: ${AUTH0_DOMINIO}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_CLAIM_TIPO_EMPLEADO: ${AUTH0_CLAIM_TIPO_EMPLEADO}
      CAMARA_LADO: ${CAMARA_LADO:-environment}
      CAMARA_FPS: ${CAMARA_FPS:-10}
      CAMARA_LADO_VISOR: ${CAMARA_LADO_VISOR:-240}
    ports:
      - "${PUERTO_WEB:-8080}:80"

  kong:
    image: kong:3.6
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong.yml
    volumes:
      - ./infra/kong/kong.yml:/kong.yml
    depends_on:
      - backend
    ports:
      - "${PUERTO_KONG:-8000}:8000"

  backend:
    build: ./servistack-backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USUARIO:-servistack}:${DB_CLAVE:-servistack}@db:5432/${DB_NOMBRE:-servistack}
      REDIS_URL: redis://redis:6379
      BROKER_URL: amqp://${BROKER_USUARIO:-servistack}:${BROKER_CLAVE:-servistack}@rabbitmq:5672
      TZ: UTC
      OTEL_SERVICE_NAME: servistack-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    deploy:
      replicas: ${REPLICAS_BACKEND:-2}
    depends_on:
      - db
      - redis
      - rabbitmq
    expose:
      - "3000"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USUARIO:-servistack}
      POSTGRES_PASSWORD: ${DB_CLAVE:-servistack}
      POSTGRES_DB: ${DB_NOMBRE:-servistack}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./servistack-backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USUARIO:-servistack}
      RABBITMQ_DEFAULT_PASS: ${BROKER_CLAVE:-servistack}
    ports:
      - "5672:5672"
      - "15672:15672"

  otel-collector:
    image: otel/opentelemetry-collector:0.104.0
    command: ["--config=/etc/otel.yml"]
    volumes:
      - ./infra/otel/collector.yml:/etc/otel.yml
    ports:
      - "4318:4318"

  kuma-cp:
    image: kumahq/kuma-cp:2.8.0
    command: ["run"]
    environment:
      KUMA_ENVIRONMENT: universal
      KUMA_STORE_TYPE: memory
      KUMA_MODE: zone
    ports:
      - "5681:5681"
    profiles: ["malla"]

volumes:
  db_data:
